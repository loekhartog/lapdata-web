<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Tools 3</title>
<link rel="icon" href="assets/icons/small/circuittools-16px.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script>
  (function () { try { var q = new URLSearchParams(location.search).get('theme'); var s = JSON.parse(localStorage.getItem('ct3.settings') || '{}'); var t = q ? q : (s.theme || 'Light').toLowerCase(); document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); } catch (e) { } })();
</script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="window">
  <div id="titlebar">
    <img class="appicon" src="assets/icons/small/circuittools-16px.png" alt="">
    <span id="status"></span>
    <span class="title">Circuit Tools 3 3.2.120.1762</span>
    <div class="caption"><span>&#8211;</span><span>&#9633;</span><span class="close">&#10005;</span></div>
  </div>

  <div id="ribbon">
    <button class="rb" id="btn-file" data-menu-anchor><img class="ico" data-icon="menu" alt=""><span>File</span><span class="caret">&#9660;</span></button>
    <button class="rb" id="btn-clear" title="Clear all sessions [Ctrl+N]"><img class="ico" data-icon="clear" alt=""><span>Clear</span></button>
    <span class="rsep"></span>
    <button class="rb" id="btn-view" title="Show or hide panes" data-menu-anchor><img class="ico" data-icon="view" alt=""><span>View</span><span class="caret">&#9660;</span></button>
    <span class="rsep"></span>
    <button class="rb" id="btn-laps" title="Show laps and split times"><img class="ico" data-icon="laps" alt=""><span>Laps</span></button>
    <button class="rb" id="btn-sessions" title="Show session(s)"><img class="ico" data-icon="sessions" alt=""><span>Sessions</span></button>
    <span class="rsep"></span>
    <button class="rb" id="btn-channels" title="Select which channels are shown on the graph" data-menu-anchor><img class="ico" data-icon="channels" alt=""><span>Channels</span><span class="caret">&#9660;</span></button>
    <button class="rb" id="btn-maths" title="Define Maths Channels to include in analysis"><img class="ico" data-icon="maths-channels" alt=""><span>Maths</span></button>
    <button class="rb" id="btn-reports" title="Show Reports Dialogue"><img class="ico" data-icon="charts" alt=""><span>Reports</span></button>
    <button class="rb nolabel" id="btn-measure" title="Show details about the maximum, minimum and average values of all channels in the selected region on the graph"><img class="ico" data-icon="measure" alt=""></button>
    <span class="rsep"></span>
    <button class="rb" id="btn-play" title="Play/Pause [Space] or [Return] or [Enter]"><img class="ico" data-icon="playback-play" alt=""><span>Play</span></button>
    <div class="rcombo" id="speed-combo" title="Playback Speed: [Num +], [Num -]" data-menu-anchor><span>x 1</span><span class="caret">&#9660;</span></div>
    <button class="rb nolabel" id="btn-stop" title="Stop [Num 0] or [Backspace]"><img class="ico" data-icon="playback-stop" alt=""></button>
    <button class="rb nolabel" id="btn-full" title="Full Screen [F5] or [Alt + V]"><img class="ico" data-icon="expand" alt=""></button>
    <span class="rsep"></span>
    <span class="rlabel">Track</span>
    <div class="rcombo" id="track-combo" style="min-width:150px" data-menu-anchor><span>Brands Hatch Indy</span><span class="caret">&#9660;</span></div>
    <button class="rb nolabel" id="btn-trackmenu" title="Track Map Options" data-menu-anchor><img class="ico" data-icon="menu-ellipsis-lighter" alt=""></button>
    <span class="rsep"></span>
    <button class="rb" id="btn-insights" title="Analyse grip usage and braking performance through each corner"><img class="ico lg" data-icon="insights" data-size="medium" alt=""><span>Insights</span><span class="caret" id="btn-insights-caret" data-menu-anchor>&#9660;</span></button>
    <span class="spacer"></span>
    <div class="right">
      <button class="rb" id="btn-settings" title="Show/Hide Settings"><img class="ico" data-icon="settings" alt=""><span>Settings</span></button>
      <button class="rb" id="btn-help" data-menu-anchor><img class="ico" data-icon="help" alt=""><span>Help</span></button>
    </div>
  </div>

  <div id="dock">
    <div class="toolwin" id="tw-sessions">
      <div class="session-tabs" id="session-tabs"></div>
      <div class="body"><div class="laps-wrap"><div class="laps-scroll" id="laps-host"></div></div></div>
    </div>
    <div class="splitter-v" id="split-v"></div>
    <div class="toolwin" id="tw-video">
      <div class="body">
        <div class="video-grid" id="video-grid"></div>
        <div class="video-toolbar" id="video-toolbar">
          <span class="vb loadvid" title="Load onboard video (.mp4) for the current session"><img src="assets/icons/small/hd-overlay.png" alt="" style="width:14px"></span>
          <span class="vb ideal" title="Generate ideal lap video for current session"><img src="assets/icons/small/ideal-lap.png" alt="" style="width:14px"></span>
          <span class="vb export" title="Export selected laps from current session as VBOs and video"><img src="assets/icons/small/export-video.png" alt="" style="width:14px"></span>
          <span class="vb full" title="Toggle Fullscreen [V] or [Alt + V]">&#x26F6;</span>
        </div>
      </div>
    </div>
    <div class="splitter-h" id="split-h"></div>
    <div class="toolwin" id="tw-graph">
      <div class="body"><div class="graph-wrap"><div class="sector-bar" id="sector-bar"></div><canvas id="chart"></canvas></div></div>
    </div>
    <div class="toolwin" id="tw-map">
      <div class="body">
        <div class="map-wrap">
          <div id="map"></div>
          <div class="map-ctx hidden" id="map-ctx"></div>
          <div class="map-buttons">
            <span class="mb" id="map-speedo" title="Display Speed overlay on HD Video"><img src="assets/icons/medium/speedo-light.png" alt=""></span>
            <span class="mb" id="map-settings" title="Settings" data-menu-anchor><img src="assets/icons/medium/settings.png" alt=""></span>
            <span class="mb" id="map-centre" title="Toggle Centre on Vehicle"><img src="assets/icons/medium/center_on_vehicle.png" alt=""></span>
            <span class="mb" id="map-reset" title="Reset Zoom"><img src="assets/icons/medium/reset_zoom.png" alt=""></span>
            <span class="mb" id="map-zin" title="Zoom in">+</span>
            <span class="mb" id="map-zout" title="Zoom out">&#8722;</span>
          </div>
          <div class="map-attrib">Imagery © Esri, Maxar, Earthstar Geographics · Track data © Racelogic Circuit Database</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<input type="file" id="file-input" accept=".vbo,.mp4,.mov,.m4v,.webm" multiple class="hidden">
<input type="file" id="folder-input" webkitdirectory multiple class="hidden">
<input type="file" id="video-input" accept=".mp4,.mov,.m4v,.webm" multiple class="hidden">
<div id="dropzone" class="hidden"><div><b>Drop VBOX files</b>.vbo files load as sessions · .mp4 files attach as onboard video</div></div>
<div id="progress" class="hidden"></div>
<script src="js/data.js"></script>
<script src="js/vbo.js"></script>
<script src="js/maths.js"></script>
<script src="js/charts.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
